<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risposte soggetto Green</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183229;background:#f3f7f4}*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:760px;margin:auto}.panel{background:white;border:1px solid #dce7df;border-radius:16px;padding:clamp(20px,4vw,38px);box-shadow:0 6px 25px #163b2410}h1{font-size:clamp(25px,4vw,34px);margin:0 0 8px}h2{font-size:23px;margin:0 0 8px}.sub{color:#52685a}.progress{height:9px;background:#e5eee8;border-radius:12px;margin:22px 0 28px;overflow:hidden}.bar{height:100%;background:#32845c;transition:width .2s}.field{margin:22px 0}label.main{display:block;font-weight:650;margin-bottom:9px}input[type=text],input[type=number],select{width:100%;padding:13px;border:1px solid #aebfb4;border-radius:9px;font:inherit}fieldset{border:0;padding:0;margin:25px 0 34px}legend{font-weight:650;margin-bottom:14px;line-height:1.45}.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}.scale label{display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #b9cfc0;border-radius:9px;height:45px;font-weight:600}.scale input{position:absolute;opacity:0;width:1px;height:1px}.scale label:has(input:checked){background:#24734e;color:white;border-color:#24734e}.scale label:has(input:focus-visible){outline:3px solid #85b69b;outline-offset:2px}.ends{display:flex;justify-content:space-between;color:#52685a;font-size:12px;margin-top:8px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}button{border:0;border-radius:9px;padding:13px 24px;font:inherit;font-weight:650;cursor:pointer;background:#26784f;color:white}button.secondary{background:#e8f0ea;color:#21432f}button:disabled{opacity:.55;cursor:wait}.error{color:#b42318;min-height:24px}.success{padding:18px;background:#e8f6eb;border-radius:12px}.small{font-size:13px;color:#53645a}@media(max-width:450px){.scale{gap:3px}.scale label{height:40px;font-size:13px}.panel{padding:18px}.actions button{padding:12px 17px}}
</style>
</head>
<body><main class="wrap"><section class="panel"><div id="app"></div></section></main>
<script>
'use strict';
// Incolla qui l'URL /exec della distribuzione di Google Apps Script.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUN85agaNuNshcxmFnNYb-tHDTKLLfU9hG241zXBLNscRbTmwqdQfKZI4PhauL_qcyBQ/exec';
const data={partecipante:'',anni:'',sesso:'',risposte:Array(8).fill(null).map(()=>({compagno:null,propria:null}))};
let step=0,submitting=false,completed=false;
const sessionId=(()=>{const k='postblock_session_'+'Green';let v=sessionStorage.getItem(k);if(!v){v=crypto.randomUUID();sessionStorage.setItem(k,v);}return v;})();
const app=document.getElementById('app');
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scale(key,value){return `<fieldset><legend>${key==='compagno'?'Qual è la tua valutazione in merito alla performance del tuo compagno?':'Qual è la tua valutazione in merito alla tua performance?'}</legend><div class="scale">${Array.from({length:10},(_,i)=>{const n=i+1;return `<label><input type="radio" name="${key}" value="${n}" ${value===n?'checked':''}><span>${n}</span></label>`}).join('')}</div><div class="ends"><span>1 = performance molto scarsa</span><span>10 = performance eccellente</span></div></fieldset>`}
function render(){if(completed){app.innerHTML='<h1>Risposte inviate</h1><p class="success" role="status">Grazie. Tutte le 8 prove sono state salvate correttamente.</p>';return;}
const title=step===0?'Dati partecipante':`Prova ${step} di 8`;
app.innerHTML=`<p class="sub">Risposte soggetto Green · ${step===0?'Sezione iniziale':`Sezione ${step+1} di 9`}</p><h1>${title}</h1><p class="sub">${step===0?'Compila i dati iniziali per cominciare.':'Valuta entrambe le performance dopo aver completato questa prova.'}</p><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="${step+1}"><div class="bar" style="width:${(step+1)/9*100}%"></div></div>${step===0?`<div class="field"><label class="main" for="participant">Partecipante *</label><input id="participant" type="text" maxlength="100" value="${escapeHtml(data.partecipante)}" autocomplete="off"></div><div class="field"><label class="main" for="years">Anni</label><input id="years" type="number" min="0" max="120" step="1" value="${escapeHtml(data.anni)}"></div><div class="field"><label class="main" for="sex">Sesso alla nascita</label><select id="sex"><option value="">Seleziona (facoltativo)</option><option value="Femmina" ${data.sesso==='Femmina'?'selected':''}>Femmina</option><option value="Maschio" ${data.sesso==='Maschio'?'selected':''}>Maschio</option></select></div>`:scale('compagno',data.risposte[step-1].compagno)+scale('propria',data.risposte[step-1].propria)}<p class="error" id="error" role="alert"></p><div class="actions">${step>0?'<button type="button" class="secondary" id="back">Indietro</button>':'<span></span>'}<button type="button" id="next">${step===8?'Salva prova 8 e termina':step===0?'Avanti':`Salva prova ${step} e avanti`}</button></div><p class="small">* Campo obbligatorio. Le valutazioni sono obbligatorie. Ogni prova viene salvata quando premi Avanti.</p>`;
if(step===0){for(const id of ['participant','years','sex'])document.getElementById(id).addEventListener('input',save);}else{app.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',save));}
document.getElementById('next').addEventListener('click',next);if(step>0)document.getElementById('back').addEventListener('click',()=>{save();step--;render();});}
function save(){if(step===0){data.partecipante=document.getElementById('participant').value.trim();data.anni=document.getElementById('years').value;data.sesso=document.getElementById('sex').value;}else{for(const key of ['compagno','propria']){const el=app.querySelector(`input[name="${key}"]:checked`);data.risposte[step-1][key]=el?Number(el.value):null;}}}
async function next(){if(submitting)return;save();const err=document.getElementById('error');if(step===0){if(!data.partecipante){err.textContent='Inserisci il codice partecipante.';return;}if(data.anni!==''&&(!Number.isInteger(Number(data.anni))||Number(data.anni)<0||Number(data.anni)>120)){err.textContent='Inserisci un numero di anni valido oppure lascia il campo vuoto.';return;}}else{const r=data.risposte[step-1];if(r.compagno===null||r.propria===null){err.textContent='Rispondi a entrambe le domande prima di proseguire.';return;}}if(step===0){step++;render();window.scrollTo(0,0);return;}if(!SCRIPT_URL.startsWith('https://script.google.com/macros/s/')){err.textContent='Il questionario non è ancora collegato al foglio risposte. Configura SCRIPT_URL.';return;}submitting=true;const button=document.getElementById('next');button.disabled=true;button.textContent='Invio in corso…';try{const response=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({sessionId,prova:step,partecipante:data.partecipante,anni:data.anni,sesso:data.sesso,compagno:data.risposte[step-1].compagno,propria:data.risposte[step-1].propria})});if(!response.ok)throw Error('Il server non ha risposto correttamente.');const result=await response.json();if(!result.ok)throw Error(result.error||'Salvataggio non confermato.');if(step<8){step++;render();}else{completed=true;sessionStorage.removeItem('postblock_session_'+'Green');render();}window.scrollTo(0,0);}catch(e){err.textContent='Salvataggio non confermato: '+e.message+' Prima di riprovare, verifica se la risposta è già presente nel foglio.';button.disabled=false;button.textContent='Riprova salvataggio';}finally{submitting=false;}}
render();
</script></body></html>
